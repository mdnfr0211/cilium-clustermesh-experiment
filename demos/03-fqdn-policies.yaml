# Apply to cluster-1. This is an internet egress policy, independent of
# ClusterMesh's private DNS and the peer-cluster control-plane connection.
apiVersion: v1
kind: Pod
metadata:
  name: fqdn-client
  namespace: test-mesh
  labels:
    app: fqdn-client
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.12.1
      command: ["sleep", "infinity"]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: fqdn-client-allow-github-api
  namespace: test-mesh
spec:
  endpointSelector:
    matchLabels:
      app: fqdn-client
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: api.github.com
    - toFQDNs:
        - matchName: api.github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
