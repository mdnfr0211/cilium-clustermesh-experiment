apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-blue
  namespace: test-mesh
  labels:
    app: web-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-blue
  template:
    metadata:
      labels:
        app: web-blue
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "echo 'Blue Backend - Pod: '$HOSTNAME > /usr/share/nginx/html/index.html"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-green
  namespace: test-mesh
  labels:
    app: web-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-green
  template:
    metadata:
      labels:
        app: web-green
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "echo 'Green Backend - Pod: '$HOSTNAME > /usr/share/nginx/html/index.html"

---
apiVersion: v1
kind: Service
metadata:
  name: web-blue
  namespace: test-mesh
spec:
  selector:
    app: web-blue
  ports:
    - port: 80

---
apiVersion: v1
kind: Service
metadata:
  name: web-green
  namespace: test-mesh
spec:
  selector:
    app: web-green
  ports:
    - port: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cilium-ingress-demo
  namespace: test-mesh
  annotations:
    ingress.cilium.io/loadbalancer-mode: dedicated
spec:
  ingressClassName: cilium
  rules:
    - host: "blue.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-blue
                port:
                  number: 80
    - host: "green.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-green
                port:
                  number: 80
    - host: "mixed.example.com"
      http:
        paths:
          - path: /blue
            pathType: Prefix
            backend:
              service:
                name: web-blue
                port:
                  number: 80
          - path: /green
            pathType: Prefix
            backend:
              service:
                name: web-green
                port:
                  number: 80
