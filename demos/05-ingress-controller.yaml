# Apply to cluster-1 after applying 05-ingress-remote-cluster-2.yaml.
# The dedicated internal NLB is the HTTP entry point; the ClusterMesh NLB
# on TCP/2379 remains a separate control-plane endpoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-local
  namespace: test-mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingress-local
  template:
    metadata:
      labels:
        app: ingress-local
    spec:
      containers:
        - name: nginx
          image: public.ecr.aws/nginx/nginx:alpine
          command:
            - /bin/sh
            - -c
            - |
              echo 'ingress-backend=cluster-1' > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-local
  namespace: test-mesh
spec:
  selector:
    app: ingress-local
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-remote
  namespace: test-mesh
  annotations:
    service.cilium.io/global: "true"
spec:
  # Intentionally has no local backends in cluster-1.
  selector:
    app: ingress-remote-no-local-pods
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo
  namespace: test-mesh
  annotations:
    ingress.cilium.io/loadbalancer-mode: dedicated
    ingress.cilium.io/loadbalancer-class: service.k8s.aws/nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: instance
    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=false
spec:
  ingressClassName: cilium
  rules:
    - host: local.demo.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ingress-local
                port:
                  number: 80
    - host: remote.demo.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ingress-remote
                port:
                  number: 80
