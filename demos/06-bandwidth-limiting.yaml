apiVersion: v1
kind: Pod
metadata:
  name: bandwidth-limited-pod
  namespace: test-mesh
  labels:
    app: bandwidth-test
  annotations:
    kubernetes.io/egress-bandwidth: "1M"
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80

