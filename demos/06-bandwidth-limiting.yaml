# Apply to cluster-1. Fetch the files from cluster-2's mesh-client to ensure
# that traffic leaves the serving node and traverses the ClusterMesh datapath.
apiVersion: v1
kind: Pod
metadata:
  name: bandwidth-limited
  namespace: test-mesh
  labels:
    app: bandwidth-web
    profile: limited
  annotations:
    kubernetes.io/egress-bandwidth: "10M"
spec:
  containers:
    - name: nginx
      image: public.ecr.aws/nginx/nginx:alpine
      command:
        - /bin/sh
        - -c
        - |
          dd if=/dev/zero of=/usr/share/nginx/html/large.bin bs=1M count=8
          exec nginx -g 'daemon off;'
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: bandwidth-unlimited
  namespace: test-mesh
  labels:
    app: bandwidth-web
    profile: unlimited
spec:
  containers:
    - name: nginx
      image: public.ecr.aws/nginx/nginx:alpine
      command:
        - /bin/sh
        - -c
        - |
          dd if=/dev/zero of=/usr/share/nginx/html/large.bin bs=1M count=8
          exec nginx -g 'daemon off;'
      ports:
        - containerPort: 80
