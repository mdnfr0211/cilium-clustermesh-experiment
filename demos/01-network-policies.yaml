# Apply to cluster-2. The matching client is Terraform's mesh-client in
# cluster-1; the same-named client in cluster-2 is deliberately denied.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-server
  namespace: test-mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy-server
  template:
    metadata:
      labels:
        app: policy-server
    spec:
      containers:
        - name: nginx
          image: public.ecr.aws/nginx/nginx:alpine
          command:
            - /bin/sh
            - -c
            - |
              echo 'policy-server=cluster-2' > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: policy-server
  namespace: test-mesh
spec:
  selector:
    app: policy-server
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: policy-server-allow-cluster-1
  namespace: test-mesh
spec:
  endpointSelector:
    matchLabels:
      app: policy-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: mesh-client
            io.cilium.k8s.policy.cluster: cluster-1
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
