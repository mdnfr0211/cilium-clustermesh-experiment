# Apply to cluster-2. Only GET /health from cluster-1's mesh-client is allowed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-api
  namespace: test-mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-api
  template:
    metadata:
      labels:
        app: http-api
    spec:
      containers:
        - name: nginx
          image: public.ecr.aws/nginx/nginx:alpine
          command:
            - /bin/sh
            - -c
            - |
              echo healthy > /usr/share/nginx/html/health
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: http-api
  namespace: test-mesh
spec:
  selector:
    app: http-api
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: http-api-allow-health
  namespace: test-mesh
spec:
  endpointSelector:
    matchLabels:
      app: http-api
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: mesh-client
            io.cilium.k8s.policy.cluster: cluster-1
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /health
