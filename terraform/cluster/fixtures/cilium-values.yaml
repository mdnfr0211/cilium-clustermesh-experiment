kubeProxyReplacement: true

bpf:
  lbExternalClusterIP: true

routingMode: tunnel
tunnelProtocol: vxlan

ipam:
  mode: cluster-pool
  operator: {}

cluster:
  id: 0
  name: ""

clustermesh:
  useAPIServer: true
  apiserver:
    tls:
      auto:
        method: helm
    service:
      externallyCreated: true
  config:
    enabled: true
    clusters: {}

dnsProxy:
  enabled: true

ingressController:
  enabled: false
  default: false

gatewayAPI:
  enabled: true

enableEnvoyConfig: true

encryption:
  enabled: true
  type: wireguard
  nodeEncryption: true

bandwidthManager:
  enabled: true
  bbr: true

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - http
      - icmp

operator:
  replicas: 1

nodeSelectorLabels: true

tolerations:
  - operator: Exists
